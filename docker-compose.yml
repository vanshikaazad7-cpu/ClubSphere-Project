services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubsphere-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite:///./clubsphere_dev.db
      - JWT_SECRET_KEY=dev_secret_key_clubsphere_super_secure_32_chars!
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend:/app
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-uploads:
